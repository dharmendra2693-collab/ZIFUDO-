</html><!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZIFUDO Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:10px}
.box{max-width:500px;margin:0 auto;background:#fff;padding:16px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:16px}
h2{margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
.row{display:flex;gap:8px}
.row input{flex:1}
.btn{padding:10px 16px;border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}
.green{background:#0a7a3e}
.orange{background:#ff6a00}
.red{background:#d32f2f}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#eee;cursor:pointer;font-weight:700}
.tab.on{background:#ff6a00;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;gap:10px}
.item img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.hidden{display:none}
</style>
</head><body>
<div class="box"><h2>ZIFUDO Admin</h2>
<div class="tabs">
<div class="tab on" id="t1">Grocery</div>
<div class="tab" id="t2">Restaurant</div>
</div>

<!-- GROCERY PANEL -->
<div id="panel1">
<input id="pName" placeholder="Product Name जैसे Onion">
<select id="pCat">
<option value="Groceries">Groceries</option>
<option value="Veggies">Vegetables (Veggies)</option>
<option value="Fruits">Fruits</option>
<option value="Dairy">Dairy</option>
<option value="Bakery">Bakery</option>
<option value="Masala">Masala & Oil</option>
<option value="Snacks">Snacks</option>
<option value="Beverages">Beverages</option>
<option value="Personal">Personal Care</option>
<option value="Household">Household</option>
</select>
<input id="pImg" placeholder="Image Link (https://... ) optional">
<div class="row">
<input id="v1" placeholder="500g / 1 Dozen">
<input id="pr1" type="number" placeholder="Price">
</div>
<div class="row">
<input id="v2" placeholder="1 Kg / 2 Dozen (optional)">
<input id="pr2" type="number" placeholder="Price">
</div>
<div style="display:flex;gap:10px;margin-top:10px">
<button class="btn green" id="saveP">Save Product</button>
<button class="btn orange" onclick="location.href='index.html'">Go to App</button>
</div>
</div>

<!-- RESTAURANT PANEL -->
<div id="panel2" class="hidden">
<input id="rName" placeholder="Restaurant Name जैसे Pind Balluchi">
<input id="rOffer" placeholder="Offer जैसे 20% OFF">
<input id="rLoc" placeholder="Location जैसे Sector 62">
<input id="rImg" placeholder="Image Link (https://...)">
<div style="display:flex;gap:10px;margin-top:10px">
<button class="btn green" id="saveR">Save Restaurant</button>
<button class="btn orange" onclick="location.href='index.html'">Go to App</button>
</div>
</div>
</div>

<div class="box">
<h3 id="listTitle">Saved Products</h3>
<div id="list"></div>
</div>

<script>
var PRODUCTS_KEY="zf_products";
var RESTRO_KEY="zf_restros";

// Default products agar kuch na ho
var defaultP=[
{n:"Onion",t:"Veggies",img:"https://images.unsplash.com/photo-1518977956812-cd3db560639a?w=200",u:[["500g Rs20",20],["1Kg Rs40",40]]},
{n:"Tomato",t:"Veggies",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=200",u:[["500g Rs15",15],["1Kg Rs30",30]]},
{n:"Apple",t:"Fruits",img:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=200",u:[["500g Rs60",60],["1Kg Rs110",110]]}
];
var defaultR=[
{n:"Pind Balluchi",o:"20% OFF",loc:"Sector 18",img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=200"},
{n:"Mumbai Masala",o:"Flat 20% OFF",loc:"Sector 62",img:"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=200"}
];

function getProducts(){try{var d=JSON.parse(localStorage.getItem(PRODUCTS_KEY));if(d&&d.length>0)return d;}catch(e){} return defaultP;}
function getRestros(){try{var d=JSON.parse(localStorage.getItem(RESTRO_KEY));if(d&&d.length>0)return d;}catch(e){} return defaultR;}

function render(){
var type=document.getElementById("panel1").classList.contains("hidden")?"R":"P";
var container=document.getElementById("list");
var title=document.getElementById("listTitle");
if(type=="P"){
title.innerText="Saved Products ("+getProducts().length+")";
var list=getProducts();
var h="";
for(var i=0;i<list.length;i++){
h+="<div class=item><div style='display:flex;gap:10px;align-items:center'><img src='"+(list[i].img||"https://via.placeholder.com/100")+"'><div><b>"+list[i].n+"</b> - "+list[i].t+"<br><small>"+(list[i].u.map(x=>x[0]).join(", "))+"</small></div></div><button class='btn red' onclick='delP("+i+")'>Delete</button></div>";
}
container.innerHTML=h;
}else{
title.innerText="Saved Restaurants ("+getRestros().length+")";
var list=getRestros();
var h="";
for(var i=0;i<list.length;i++){
h+="<div class=item><div style='display:flex;gap:10px;align-items:center'><img src='"+(list[i].img||"https://via.placeholder.com/100")+"'><div><b>"+list[i].n+"</b><br><small>"+list[i].o+" | "+(list[i].loc||"")+"</small></div></div><button class='btn red' onclick='delR("+i+")'>Delete</button></div>";
}
container.innerHTML=h;
}
}
function delP(i){var l=getProducts();l.splice(i,1);localStorage.setItem(PRODUCTS_KEY,JSON.stringify(l));render();}
function delR(i){var l=getRestros();l.splice(i,1);localStorage.setItem(RESTRO_KEY,JSON.stringify(l));render();}

document.getElementById("t1").onclick=function(){
document.getElementById("panel1").classList.remove("hidden");
document.getElementById("panel2").classList.add("hidden");
this.classList.add("on");
document.getElementById("t2").classList.remove("on");
render();
};
document.getElementById("t2").onclick=function(){
document.getElementById("panel2").classList.remove("hidden");
document.getElementById("panel1").classList.add("hidden");
this.classList.add("on");
document.getElementById("t1").classList.remove("on");
render();
};

document.getElementById("saveP").onclick=function(){
var n=document.getElementById("pName").value.trim();
var t=document.getElementById("pCat").value;
var img=document.getElementById("pImg").value.trim()||"https://images.unsplash.com/photo-1542838132-92c53300491e?w=200";
var v1=document.getElementById("v1").value.trim();
var p1=document.getElementById("pr1").value.trim();
var v2=document.getElementById("v2").value.trim();
var p2=document.getElementById("pr2").value.trim();
if(!n||!v1||!p1){alert("Name, Variant, Price जरूरी है");return}
var u=[];
u.push([v1,Number(p1)]);
if(v2&&p2) u.push([v2,Number(p2)]);
var list=getProducts();
list.push({n:n,t:t,img:img,u:u});
localStorage.setItem(PRODUCTS_KEY,JSON.stringify(list));
// old key bhi update
localStorage.setItem("zf_products",JSON.stringify(list));
document.getElementById("pName").value="";document.getElementById("v1").value="";document.getElementById("pr1").value="";document.getElementById("v2").value="";document.getElementById("pr2").value="";document.getElementById("pImg").value="";
render();
alert("Product Saved!");
};

document.getElementById("saveR").onclick=function(){
var n=document.getElementById("rName").value.trim();
var o=document.getElementById("rOffer").value.trim();
var loc=document.getElementById("rLoc").value.trim();
var img=document.getElementById("rImg").value.trim()||"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=200";
if(!n||!o){alert("Name & Offer जरूरी है");return}
var list=getRestros();
list.push({n:n,o:o,loc:loc,img:img});
localStorage.setItem(RESTRO_KEY,JSON.stringify(list));
document.getElementById("rName").value="";document.getElementById("rOffer").value="";document.getElementById("rLoc").value="";document.getElementById("rImg").value="";
render();
alert("Restaurant Saved!");
};

// Init
render();
</script>
</body></html>
